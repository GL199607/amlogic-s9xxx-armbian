name: Verify iotbox image (one-shot)
on:
  workflow_dispatch:
    inputs:
      image_url: { description: "img.gz url", required: true }
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Download and unpack
        run: |
          set -e
          curl -sSL --retry 5 --retry-all-errors -o image.img.gz "${{ inputs.image_url }}"
          echo "gz=$(stat -c%s image.img.gz)"; sha256sum image.img.gz
          gunzip -k image.img.gz
          echo "img=$(stat -c%s image.img)"
      - name: Bootloader segments
        run: |
          set -e
          seg() { dd if=image.img bs=1M iflag=skip_bytes,count_bytes skip=$1 count=$2 2>/dev/null; }
          check() { GOT=$(seg $2 $3 | md5sum | awk '{print $1}'); [ "$GOT" = "$4" ] && R=OK || R=MISMATCH; echo "SEG_$1=$R got=$GOT want=$4"; }
          check IDBLOADER 32768   204800  6013b059b3197bb4a9f5049dc3e392dc
          check TRUST     12582912 4194304 c9d0522d1fc33f366da6900d4a295a6a
          check UBOOT     8388608  4194304 6af7e2db2b1bc596a79276cb6233c5d3
      - name: Parse GPT and mount by offset (per-index dirs)
        run: |
          set -e
          python3 - > mounts.txt <<'PY'
          import struct
          f=open('image.img','rb'); f.seek(512); h=f.read(92)
          assert h[:8]==b'EFI PART'
          plba=struct.unpack('<Q',h[72:80])[0]; n=struct.unpack('<I',h[80:84])[0]; psz=struct.unpack('<I',h[84:88])[0]
          f.seek(plba*512)
          for i in range(n):
              e=f.read(psz)
              if len(e)<128 or not e[0:16].strip(b'\x00'): continue
              st=struct.unpack('<Q',e[32:40])[0]; en=struct.unpack('<Q',e[40:48])[0]
              print("%d %d %d" % (i+1, st*512, (en-st+1)*512))
          PY
          cat mounts.txt
          while read IDX OFF BYTES; do
            MNT=/mnt/p$IDX
            sudo mkdir -p "$MNT"
            if sudo mount -o ro,offset=$OFF,sizelimit=$BYTES image.img "$MNT"; then
              echo "=== MOUNTED p$IDX off=$OFF size=$BYTES ==="
              ls "$MNT" | head -12
              if [ -f "$MNT/armbianEnv.txt" ] || [ -d "$MNT/dtb" ]; then BOOTMNT="$MNT"; echo "BOOTMNT=$MNT"; fi
              if [ -d "$MNT/lib/modules" ]; then ROOTMNT="$MNT"; echo "ROOTMNT=$MNT"; fi
            else
              echo "MOUNT_FAIL p$IDX off=$OFF"
            fi
          done < mounts.txt
          echo "=== ★ boot: iotbox dtb ==="
          find /mnt/p* -name "rk3399-iotbox3399m.dtb" 2>/dev/null | head
          echo "=== ★ dtb md5 期望 49c71e1bdd1bb87a923d686b196080f8 ==="
          find /mnt/p* -name "rk3399-iotbox3399m.dtb" -exec md5sum {} \; 2>/dev/null
          echo "=== ★ boot.scr load_addr ==="
          for f in $(find /mnt/p* -maxdepth 1 -name "boot.scr" 2>/dev/null); do echo "--- $f ---"; strings $f | grep -E "load_addr" | head -2; done
          echo "=== armbianEnv fdtfile ==="
          for f in $(find /mnt/p* -maxdepth 1 -name "armbianEnv.txt" 2>/dev/null); do grep -E "fdtfile|rootdev" $f; done
          echo "=== ★ lib/modules ==="; ls /mnt/p*/lib/modules/ 2>/dev/null
          echo "=== ★ RT5651 模块 ==="; find /mnt/p*/lib/modules -name "*rt5651*" 2>/dev/null
          echo "=== ★ modules.alias realtek,rt5651 ==="; grep -h "realtek,rt5651" /mnt/p*/lib/modules/*/modules.alias 2>/dev/null | head -4
          echo "=== RT5651 内建? ==="; grep -i rt5651 /mnt/p*/lib/modules/*/modules.builtin 2>/dev/null | head -3
          echo "=== 对照 rt5645 ==="; find /mnt/p*/lib/modules -name "snd-soc-rt5645.ko*" 2>/dev/null | head -2
